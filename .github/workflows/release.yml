# 推 v* 版本标签时：跑测试 → 构建 amd64/arm64 镜像推到 GHCR → 建 GitHub Release。
# 发版：先改 server/package.json 和 web/package.json 的 version，提交后
#   git tag v0.2.0 && git push origin v0.2.0
name: 发布 Docker 镜像

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 标签和 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in server/package.json web/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$tag" ]; then
              echo "::error::$f 的 version 是 $v，和标签 $GITHUB_REF_NAME 不一致"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 后端测试
        working-directory: server
        run: |
          npm ci
          npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR 的镜像名必须是小写
      - name: 镜像名
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 → 1.2.3、1.2、latest；带 -rc 之类后缀的预发布版不打 latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          notes=$(printf '镜像：\n\n```\ndocker pull %s:%s\n```\n' "$IMAGE" "$version")
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes $prerelease
