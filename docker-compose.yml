services:
  inkdove:
    # 用发布好的镜像：docker compose pull && docker compose up -d；本地改了代码用 --build 现编
    build: .
    image: ghcr.io/bowen1314/inkdove:latest
    # 固定主机名：WAHA 经 inkdove:<端口> 连到 inkdove 起的代理中继（F13）
    hostname: inkdove
    restart: unless-stopped
    env_file: .env
    environment:
      INKDOVE_PORT: "8794"
      INKDOVE_DATA_DIR: /app/data
      INKDOVE_WAHA_URL: http://waha:3000
      INKDOVE_WAHA_WEBHOOK_URL: http://inkdove:8794/webhooks/waha
      INKDOVE_PROXY_RELAY_HOST: inkdove
    # 只映射后台端口；代理中继的端口（INKDOVE_PROXY_RELAY_PORT_BASE 起）只在 compose 内网里给 WAHA 用，不要映射
    ports:
      - "127.0.0.1:8794:8794"
    volumes:
      - ./data:/app/data
    mem_limit: 384m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - waha

  waha:
    # GOWS 引擎镜像，见 https://waha.devlike.pro/docs/how-to/engines/
    image: devlikeapro/waha:gows
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${INKDOVE_WAHA_API_KEY:?请在 .env 里设置 INKDOVE_WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      # F4：WAHA 自动下载客户发来的语音和图片（默认就是 true），webhook 里的 media.url 按 WAHA_BASE_URL 拼；
      # inkdove 下载时只取路径部分、拼到 INKDOVE_WAHA_URL 上，所以这里写内网地址就行
      WAHA_BASE_URL: http://waha:3000
      WAHA_EVENTS_DOWNLOAD_MEDIA: "true"
    # 不映射宿主端口，只在 compose 内网里给 inkdove 用
    volumes:
      - ./waha-sessions:/app/.sessions
    mem_limit: 384m
    extra_hosts:
      - "host.docker.internal:host-gateway"
